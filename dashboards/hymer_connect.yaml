# HYMER Connect Dashboard for Home Assistant
# Updated to match actual HA entity IDs (v1.8.0, German locale)
#
# Usage:
#   1. Go to Settings > Dashboards > + Add Dashboard
#   2. Open the dashboard > Edit > three dots > Raw configuration editor
#   3. Paste this content and save

title: HYMER Connect
views:
  # ── Page 1: Vehicle Overview ──
  - title: Vehicle
    path: vehicle
    icon: mdi:rv-truck
    cards:
      - type: entities
        title: Vehicle Information
        entities:
          - entity: sensor.hymer_hymer_connect_hymer
            name: Model
          - entity: sensor.hymer_hymer_connect_hymer_2
            name: Model Year
          - entity: sensor.hymer_hymer_connect_hymer_3
            name: VIN
      - type: entities
        title: Driving
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_strecke
            name: Odometer
          - entity: sensor.hymer_hymer_connect_hymer_geschwindigkeit
            name: Speed
          - entity: sensor.hymer_hymer_connect_hymer_5
            name: RPM
          - entity: sensor.hymer_hymer_connect_hymer_20
            name: Current Gear
          - entity: sensor.hymer_hymer_connect_hymer_temperatur
            name: Coolant Temperature
          - entity: sensor.hymer_hymer_connect_hymer_7
            name: Engine Hours
          - entity: sensor.hymer_hymer_connect_hymer_25
            name: Engine Torque
      - type: entities
        title: Fuel & Range
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_strecke_2
            name: Fuel Range
          - entity: sensor.hymer_hymer_connect_hymer_23
            name: Fuel Consumption
          - entity: sensor.hymer_hymer_connect_hymer_24
            name: Total Fuel Used
          - entity: sensor.hymer_hymer_connect_hymer_strecke_3
            name: Trip Distance
          - entity: sensor.hymer_hymer_connect_hymer_adblue_level
            name: AdBlue Level
          - entity: sensor.hymer_hymer_connect_hymer_temperatur_6
            name: AdBlue Temperature
          - entity: sensor.hymer_hymer_connect_hymer_26
            name: DPF Status
      - type: entities
        title: Security
        entities:
          - entity: binary_sensor.hymer_hymer_connect_hymer_lock
            name: Lock Status
          - entity: sensor.hymer_hymer_connect_hymer_6
            name: Ignition
          - entity: binary_sensor.hymer_hymer_connect_hymer_betriebszustand
            name: Engine Running
          - entity: binary_sensor.hymer_hymer_connect_hymer
            name: Handbrake
          - entity: binary_sensor.hymer_hymer_connect_hymer_2
            name: Cruise Control
          - entity: binary_sensor.hymer_hymer_connect_hymer_sicherheit
            name: Alarm Armed
          - entity: sensor.hymer_hymer_connect_hymer_batterie
            name: Alarm Battery

  # ── Page 2: Power & Battery ──
  - title: Power
    path: power
    icon: mdi:battery-charging
    cards:
      - type: gauge
        entity: sensor.hymer_hymer_connect_hymer_battery_level
        name: Battery SOC
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 25
          red: 10
        needle: true
      - type: gauge
        entity: sensor.hymer_hymer_connect_hymer_battery_voltage
        name: Battery Voltage
        min: 10
        max: 15
        severity:
          green: 12.4
          yellow: 11.8
          red: 11.0
        needle: true
      - type: entities
        title: Habitation Battery
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_battery_voltage
            name: Battery Voltage
          - entity: sensor.hymer_hymer_connect_hymer_stromstarke
            name: Battery Current
          - entity: sensor.hymer_hymer_connect_hymer_battery_level
            name: State of Charge
          - entity: sensor.hymer_hymer_connect_hymer_10
            name: Battery Type
          - entity: sensor.hymer_hymer_connect_hymer_chassis_battery_voltage
            name: Chassis Battery
      - type: entities
        title: Charging / Solar
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_11
            name: Charge Phase
          - entity: binary_sensor.hymer_hymer_connect_hymer_ladestatus
            name: Charger Active
          - entity: sensor.hymer_hymer_connect_hymer_solar_charger_status
            name: Solar Charger Status
          - entity: binary_sensor.hymer_hymer_connect_hymer_solar_active
            name: Solar Active
          - entity: sensor.hymer_hymer_connect_hymer_spannung
            name: Solar Voltage
          - entity: sensor.hymer_hymer_connect_hymer_solar_current
            name: Solar Current
          - entity: sensor.hymer_hymer_connect_hymer_solar_power
            name: Solar Power
          - entity: sensor.hymer_hymer_connect_hymer_12
            name: Power Source
          - entity: binary_sensor.hymer_hymer_connect_hymer_solar_panel
            name: Solar Panel Connected
          - entity: binary_sensor.hymer_hymer_connect_hymer_main_switch
            name: Main Switch

  # ── Page 3: Climate & Heater ──
  - title: Climate
    path: climate
    icon: mdi:thermometer
    cards:
      - type: entities
        title: Temperatures
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_temperatur_2
            name: Indoor
          - entity: sensor.hymer_hymer_connect_hymer_temperatur_3
            name: Outdoor
          - entity: sensor.hymer_hymer_connect_hymer_temperatur_5
            name: Ambient
      - type: entities
        title: Truma Heater
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_8
            name: Heater State
          - entity: sensor.hymer_hymer_connect_hymer_heater_fan_speed
            name: Fan Speed
          - entity: sensor.hymer_hymer_connect_hymer_temperatur_4
            name: Setpoint
          - entity: sensor.hymer_hymer_connect_hymer_19
            name: Fuel Type
          - entity: sensor.hymer_hymer_connect_hymer_leistung
            name: Electric Power
          - entity: sensor.hymer_hymer_connect_hymer_13
            name: Operating Mode
          - entity: binary_sensor.hymer_hymer_connect_hymer_konnektivitat_3
            name: Truma Connected
          - entity: sensor.hymer_hymer_connect_hymer_32
            name: Truma Status
      - type: entities
        title: Fridge
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_21
            name: Fridge Mode
          - entity: sensor.hymer_hymer_connect_hymer_22
            name: Fridge Status

  # ── Page 4: Water ──
  - title: Water
    path: water
    icon: mdi:water
    cards:
      - type: gauge
        entity: sensor.hymer_hymer_connect_hymer_fresh_water_level
        name: Fresh Water
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 25
          red: 10
        needle: true
      - type: gauge
        entity: sensor.hymer_hymer_connect_hymer_14
        name: Gray Water
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 80
        needle: true
      - type: entities
        title: Water System
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_fresh_water_level
            name: Fresh Water Level
          - entity: sensor.hymer_hymer_connect_hymer_14
            name: Grey Water Level
          - entity: binary_sensor.hymer_hymer_connect_hymer_water_pump
            name: Water Pump

  # ── Page 5: Doors & Lights ──
  - title: Doors
    path: doors
    icon: mdi:car-door
    cards:
      - type: entities
        title: Doors
        entities:
          - entity: binary_sensor.hymer_hymer_connect_hymer_driver_door
            name: Driver Door
          - entity: binary_sensor.hymer_hymer_connect_hymer_passenger_door
            name: Passenger Door
          - entity: binary_sensor.hymer_hymer_connect_hymer_sliding_door
            name: Sliding Door
          - entity: binary_sensor.hymer_hymer_connect_hymer_tur
            name: Rear Door
          - entity: binary_sensor.hymer_hymer_connect_hymer_lock
            name: Lock Status
          - entity: binary_sensor.hymer_hymer_connect_hymer_4
            name: Step Retracted
      - type: entities
        title: Vehicle Lights
        entities:
          - entity: binary_sensor.hymer_hymer_connect_hymer_licht
            name: Headlamp
          - entity: binary_sensor.hymer_hymer_connect_hymer_licht_2
            name: High Beam
          - entity: binary_sensor.hymer_hymer_connect_hymer_licht_3
            name: Parking Light
          - entity: binary_sensor.hymer_hymer_connect_hymer_licht_4
            name: Fog Front
          - entity: binary_sensor.hymer_hymer_connect_hymer_licht_5
            name: Fog Rear
          - entity: binary_sensor.hymer_hymer_connect_hymer_3
            name: Turn Signal
      - type: entities
        title: Habitation Lights
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_28
            name: Light Group 1
          - entity: sensor.hymer_hymer_connect_hymer_29
            name: Light Group 2

  # ── Page 6: GPS & Location ──
  - title: GPS
    path: gps
    icon: mdi:map-marker
    cards:
      - type: map
        entities:
          - entity: device_tracker.hymer_hymer_connect_hymer_location
        default_zoom: 15
        hours_to_show: 24
      - type: entities
        title: GPS Details
        entities:
          - entity: device_tracker.hymer_hymer_connect_hymer_location
            name: Location
          - entity: sensor.hymer_hymer_connect_hymer_15
            name: Coordinates
          - entity: sensor.hymer_hymer_connect_hymer_17
            name: Altitude
          - entity: sensor.hymer_hymer_connect_hymer_34
            name: Heading
          - entity: sensor.hymer_hymer_connect_hymer_33
            name: Satellites
          - entity: sensor.hymer_hymer_connect_hymer_16
            name: Signal Quality
          - entity: binary_sensor.hymer_hymer_connect_hymer_konnektivitat
            name: GPS Fix

  # ── Page 7: System ──
  - title: System
    path: system
    icon: mdi:chip
    cards:
      - type: entities
        title: Connectivity
        entities:
          - entity: binary_sensor.hymer_hymer_connect_hymer_konnektivitat_2
            name: SCU Connected
          - entity: sensor.hymer_hymer_connect_hymer_30
            name: SCU Firmware
          - entity: sensor.hymer_hymer_connect_hymer_31
            name: Truma Firmware
      - type: entities
        title: Tires
        entities:
          - entity: sensor.hymer_hymer_connect_hymer_druck
            name: Tire Pressure
