# HYMER Connect Dashboard for Home Assistant
# Updated for v2.6.3 — Modern tile-based design, mobile-friendly
#
# Prerequisites:
#   - Home Assistant 2022.11+ (tile cards)
#   - No custom HACS frontend cards required — 100% stock HA
#   - "All Wohnen" and "All Privat" light groups (Settings > Helpers > Light group)
#   - See dashboards/README.md for light group setup instructions
#
# Usage:
#   1. Go to Settings > Dashboards > + Add Dashboard
#   2. Open the dashboard > Edit > three dots > Raw configuration editor
#   3. Paste this content and save

title: HYMER Connect
views:
  # ── Overview (at-a-glance) ────────────────────────────────
  - title: Overview
    path: overview
    icon: mdi:rv-truck
    cards:
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.hymer_battery_level
            name: Battery
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true
          - type: gauge
            entity: sensor.hymer_fresh_water_level
            name: Fresh Water
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.hymer_12v_main_switch
            name: 12V Main
            icon: mdi:flash
            color: amber
          - type: tile
            entity: switch.hymer_water_pump
            name: Water Pump
            icon: mdi:water-pump
            color: cyan
          - type: tile
            entity: binary_sensor.hymer_lock
            name: Lock
            icon: mdi:lock
            color: green
          - type: tile
            entity: binary_sensor.hymer_scu_connected
            name: SCU Online
            icon: mdi:access-point
            color: green
      - type: thermostat
        entity: climate.hymer_truma_heater
        name: Truma Heater
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - heat
              - "off"
      - type: map
        entities:
          - entity: device_tracker.hymer_location
        default_zoom: 15
        hours_to_show: 24
        aspect_ratio: "16:9"

  # ── Power & Electric ──────────────────────────────────────
  - title: Power
    path: power
    icon: mdi:battery-charging
    cards:
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.hymer_battery_level
            name: SOC
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true
          - type: gauge
            entity: sensor.hymer_battery_voltage
            name: Voltage
            min: 10
            max: 15
            severity:
              green: 12.4
              yellow: 11.8
              red: 11
            needle: true
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.hymer_12v_main_switch
            name: 12V Main Switch
            icon: mdi:flash
            color: amber
          - type: tile
            entity: binary_sensor.hymer_main_switch
            name: Main Switch
            icon: mdi:power
            color: red
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### 🔋 Habitation Battery"
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.hymer_battery_voltage
                name: Voltage
                icon: mdi:sine-wave
                color: deep-purple
              - type: tile
                entity: sensor.hymer_battery_current
                name: Current
                icon: mdi:current-dc
                color: deep-purple
              - type: tile
                entity: sensor.hymer_battery_level
                name: SOC
                icon: mdi:battery
                color: green
              - type: tile
                entity: sensor.hymer_chassis_battery_voltage
                name: Chassis
                icon: mdi:car-battery
                color: orange
          - type: tile
            entity: sensor.hymer_battery_type
            name: Battery Type
            icon: mdi:battery-heart-variant
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### ☀️ Solar & Charging"
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.hymer_charger
                name: Charger
                icon: mdi:ev-plug-type2
                color: green
              - type: tile
                entity: binary_sensor.hymer_solar_active
                name: Solar
                icon: mdi:solar-power
                color: amber
              - type: tile
                entity: sensor.hymer_solar_voltage
                name: Solar V
                icon: mdi:solar-panel
                color: amber
              - type: tile
                entity: sensor.hymer_solar_current
                name: Solar A
                icon: mdi:current-dc
                color: amber
              - type: tile
                entity: sensor.hymer_solar_power
                name: Solar W
                icon: mdi:flash
                color: amber
              - type: tile
                entity: sensor.hymer_charge_phase
                name: Phase
                icon: mdi:sine-wave
                color: deep-purple
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.hymer_power_source
                name: Source
                icon: mdi:power-plug
              - type: tile
                entity: binary_sensor.hymer_solar_panel
                name: Panel
                icon: mdi:solar-panel-large
                color: amber

