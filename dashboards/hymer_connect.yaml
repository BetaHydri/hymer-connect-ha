# HYMER Connect Dashboard for Home Assistant
# Updated for v2.9.8 — Clear visual hierarchy on mobile
#
# Design:
#   - Section headers  = markdown banners (── TITLE ──) — clearly labels
#   - Tile cards       = interactive controls (switches, selects, lights)
#   - Entities cards   = read-only status info (compact rows)
#   - Gauge cards      = visual level indicators
#
# Prerequisites:
#   - Home Assistant 2022.11+ (tile cards)
#   - No custom HACS frontend cards required — 100% stock HA
#   - "All Wohnen" and "All Privat" light groups (Settings > Helpers > Light group)
#   - See dashboards/README.md for light group setup instructions
#
# Usage:
#   1. Go to Settings > Dashboards > + Add Dashboard
#   2. Open the dashboard > Edit > three dots > Raw configuration editor
#   3. Paste this content and save

title: HYMER Connect
views:
  # ══════════════════════════════════════════════════════════
  # Overview (at-a-glance)
  # ══════════════════════════════════════════════════════════
  - title: Overview
    path: overview
    icon: mdi:rv-truck
    cards:
      # ── Gauges ──
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.hymer_battery_level
            name: Battery
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true
          - type: gauge
            entity: sensor.hymer_fresh_water_ebl
            name: Fresh Water
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true

      # ── Controls ──
      - type: markdown
        content: "## ⚡ Controls"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.hymer_12v_main_switch
            name: 12V Main
            icon: mdi:flash
            color: amber
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle 12V main switch? This controls all habitation devices."
          - type: tile
            entity: switch.hymer_water_pump
            name: Water Pump
            icon: mdi:water-pump
            color: cyan

      # ── Status ──
      - type: entities
        title: "Status"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_lock
            name: Lock
            icon: mdi:lock
          - entity: binary_sensor.hymer_scu_connected
            name: SCU Online
            icon: mdi:access-point
          - entity: sensor.hymer_outside_temperature
            name: Outside Temp
            icon: mdi:thermometer

      # ── Heater ──
      - type: thermostat
        entity: climate.hymer_truma_heater
        name: Truma Heater
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - heat
              - "off"

      # ── Location ──
      - type: map
        entities:
          - entity: device_tracker.hymer_location
        default_zoom: 15
        hours_to_show: 24
        aspect_ratio: "16:9"

  # ══════════════════════════════════════════════════════════
  # Energy Flow
  # ══════════════════════════════════════════════════════════
  - title: Energy
    path: energy
    icon: mdi:solar-power-variant
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # ── Row 1: Gauges + Real-Time Graphs ──
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.hymer_battery_level
                name: Lithium SOC
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 25
                  red: 10
                needle: true
              - type: gauge
                entity: sensor.hymer_bms_state_of_health
                name: Battery SoH
                min: 0
                max: 100
                severity:
                  green: 80
                  yellow: 60
                  red: 40
                needle: true
              - type: sensor
                entity: sensor.hymer_solar_power
                name: Solar Production
                icon: mdi:solar-power
                graph: line
                hours_to_show: 24
                detail: 2
              - type: sensor
                entity: sensor.hymer_bms_current
                name: Net Battery Flow
                icon: mdi:battery-charging
                graph: line
                hours_to_show: 24
                detail: 2
              - type: sensor
                entity: sensor.hymer_battery_current
                name: Habitation Load
                icon: mdi:current-dc
                graph: line
                hours_to_show: 24
                detail: 2

          # ── Row 2: History Charts ──
          - type: horizontal-stack
            cards:
              - type: statistics-graph
                title: "☀️ Solar Energy (kWh/day)"
                entities:
                  - entity: sensor.hymer_solar_energy
                    name: Solar Energy
                stat_types:
                  - change
                period: day
                days_to_show: 30
              - type: history-graph
                title: "🔋 Battery Voltages (24h)"
                hours_to_show: 24
                entities:
                  - entity: sensor.hymer_battery_voltage
                    name: Habitation (EBL)
                  - entity: sensor.hymer_bms_voltage
                    name: Lithium (BMS)
                  - entity: sensor.hymer_chassis_battery_voltage
                    name: Chassis (Starter)

          # ── Row 3: Solar | Battery | Power Sources ──
          - type: horizontal-stack
            cards:
              - type: entities
                title: "☀️ Solar"
                show_header_toggle: false
                entities:
                  - entity: sensor.hymer_solar_power
                    name: Production
                    icon: mdi:solar-power
                  - entity: sensor.hymer_solar_voltage
                    name: Voltage
                    icon: mdi:solar-panel
                  - entity: sensor.hymer_solar_current
                    name: Current
                    icon: mdi:current-dc
                  - entity: binary_sensor.hymer_solar_active
                    name: Active
                    icon: mdi:solar-power
              - type: entities
                title: "🔋 Battery"
                show_header_toggle: false
                entities:
                  - entity: sensor.hymer_bms_current
                    name: Net Flow (BMS)
                    icon: mdi:battery-charging
                  - entity: sensor.hymer_battery_current
                    name: Load Draw (EBL)
                    icon: mdi:power-plug
                  - entity: sensor.hymer_bms_voltage
                    name: Voltage
                    icon: mdi:sine-wave
                  - entity: sensor.hymer_bms_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.hymer_bms_capacity_remaining
                    name: Remaining
                    icon: mdi:battery
              - type: entities
                title: "🔌 Power Sources"
                show_header_toggle: false
                entities:
                  - entity: sensor.hymer_power_source
                    name: Source
                    icon: mdi:power-plug-outline
                  - entity: sensor.hymer_charge_phase
                    name: Charge Phase
                    icon: mdi:ev-station
                  - entity: binary_sensor.hymer_stecker
                    name: Shore Power
                    icon: mdi:power-plug
                  - entity: sensor.hymer_heater_electric_power
                    name: Heater Electric
                    icon: mdi:radiator

  # ══════════════════════════════════════════════════════════
  # Power & Electric
  # ══════════════════════════════════════════════════════════
  - title: Power
    path: power
    icon: mdi:battery-charging
    cards:
      # ── Gauges ──
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.hymer_battery_level
            name: SOC
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true
          - type: gauge
            entity: sensor.hymer_battery_voltage
            name: Voltage
            min: 10
            max: 15
            severity:
              green: 12.4
              yellow: 11.8
              red: 11
            needle: true

      # ── Controls ──
      - type: markdown
        content: "## ⚡ Controls"
      - type: tile
        entity: switch.hymer_12v_main_switch
        name: 12V Main Switch
        icon: mdi:flash
        color: amber
        tap_action:
          action: toggle
          confirmation:
            text: "Toggle 12V main switch? This controls all habitation devices."

      # ── Habitation Battery ──
      - type: entities
        title: "🔋 Habitation Battery"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_battery_voltage
            name: Voltage
            icon: mdi:sine-wave
          - entity: sensor.hymer_battery_current
            name: Load Draw
            icon: mdi:current-dc
          - entity: sensor.hymer_battery_level
            name: SOC
            icon: mdi:battery
          - entity: sensor.hymer_chassis_battery_voltage
            name: Chassis Battery
            icon: mdi:car-battery
          - entity: sensor.hymer_battery_type
            name: Battery Type
            icon: mdi:battery-heart-variant
          - entity: binary_sensor.hymer_main_switch
            name: Main Switch
            icon: mdi:power
          - entity: sensor.hymer_power_source
            name: Power Source
            icon: mdi:power-plug
          - entity: binary_sensor.hymer_stecker
            name: Shore Power
            icon: mdi:power-plug

      # ── Solar & Charging ──
      - type: entities
        title: "☀️ Solar & Charging"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_solar_active
            name: Solar Active
            icon: mdi:solar-power
          - entity: sensor.hymer_solar_voltage
            name: Solar Voltage
            icon: mdi:solar-panel
          - entity: sensor.hymer_solar_current
            name: Solar Current
            icon: mdi:current-dc
          - entity: sensor.hymer_solar_power
            name: Solar Power
            icon: mdi:flash
          - entity: sensor.hymer_charge_phase
            name: Charge Phase
            icon: mdi:sine-wave

      # ── BOS LUX BMS ──
      - type: entities
        title: "🔋 BOS LUX Battery (BMS)"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_bms_voltage
            name: BMS Voltage
            icon: mdi:battery-charging
          - entity: sensor.hymer_bms_current
            name: Net Battery Current
            icon: mdi:current-dc
          - entity: sensor.hymer_bms_temperature
            name: BMS Temperature
            icon: mdi:thermometer
          - entity: sensor.hymer_bms_state_of_health
            name: State of Health
            icon: mdi:battery-heart
          - entity: sensor.hymer_bms_capacity_remaining
            name: Capacity Remaining
            icon: mdi:battery

  # ══════════════════════════════════════════════════════════
  # Climate & Appliances
  # ══════════════════════════════════════════════════════════
  - title: Climate
    path: climate
    icon: mdi:thermometer
    cards:
      # ── Ambient ──
      - type: entities
        title: "🌡️ Temperature"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_outside_temperature
            name: Outside Temp
            icon: mdi:thermometer

      # ── Heater Control ──
      - type: markdown
        content: "## ⚡ Controls"
      - type: horizontal-stack
        cards:
          - type: thermostat
            entity: climate.hymer_truma_heater
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - heat
                  - "off"
            show_current_as_primary: false
            name: Truma Heater
          - type: vertical-stack
            cards:
              - type: tile
                entity: select.hymer
                name: Energy Source
                icon: mdi:gas-station
                color: orange
              - type: tile
                entity: select.hymer_boiler_mode
                name: Boiler Mode
                icon: mdi:water-boiler
                color: red
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: select.hymer_fridge_mode
            name: Fridge Cooling
            icon: mdi:fridge
            color: light-blue
          - type: tile
            entity: switch.hymer_fridge_eco_leise
            name: Fridge Quiet
            icon: mdi:volume-off
            color: teal

      # ── Fridge Status ──
      - type: entities
        title: "❄️ Fridge Status"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_fridge_door
            name: Door
            icon: mdi:fridge-alert

      # ── Heater Status ──
      - type: entities
        title: "🔥 Heater Status"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_heater_fan_speed
            name: Fan Speed
            icon: mdi:fan
          - entity: sensor.hymer_heater_fuel_type
            name: Fuel Type
            icon: mdi:gas-station
          - entity: sensor.hymer_heater_electric_power
            name: Electric Power
            icon: mdi:flash
          - entity: sensor.hymer_heater_operating_mode
            name: Operating Mode
            icon: mdi:cog
          - entity: binary_sensor.hymer_truma_connected
            name: Truma Connected
            icon: mdi:connection
          - entity: sensor.hymer_truma_status
            name: Truma Status
            icon: mdi:information

  # ══════════════════════════════════════════════════════════
  # Water
  # ══════════════════════════════════════════════════════════
  - title: Water
    path: water
    icon: mdi:water
    cards:
      # ── Gauges ──
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.hymer_fresh_water_ebl
            name: Fresh (EBL)
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true
          - type: gauge
            entity: sensor.hymer_grey_water_ebl
            name: Grey (EBL)
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 80
            needle: true

      # ── Controls ──
      - type: markdown
        content: "## ⚡ Controls"
      - type: tile
        entity: switch.hymer_water_pump
        name: Water Pump
        icon: mdi:water-pump
        color: cyan

      # ── Tank Status ──
      - type: entities
        title: "💧 Tank Levels"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_fresh_water_ebl
            name: Fresh Water
            icon: mdi:water
          - entity: sensor.hymer_grey_water_ebl
            name: Grey Water
            icon: mdi:water-off
          - entity: binary_sensor.hymer_water_pump
            name: Pump Active
            icon: mdi:water-pump

  # ══════════════════════════════════════════════════════════
  # Vehicle
  # ══════════════════════════════════════════════════════════
  - title: Vehicle
    path: vehicle
    icon: mdi:car-info
    cards:
      # ── Vehicle Info ──
      - type: entities
        title: "🚐 Vehicle Info"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_model
            name: Model
            icon: mdi:rv-truck
          - entity: sensor.hymer_model_year
            name: Year
            icon: mdi:calendar
          - entity: sensor.hymer_vin
            name: VIN
            icon: mdi:identifier

      # ── Driving ──
      - type: entities
        title: "🏎️ Driving"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_odometer
            name: Odometer
            icon: mdi:counter
          - entity: sensor.hymer_outside_temperature
            name: Outside Temp
            icon: mdi:thermometer
          - entity: sensor.hymer_distance_to_next_service
            name: Next Service
            icon: mdi:wrench-clock
          - entity: sensor.hymer_fuel_level
            name: Fuel Level
            icon: mdi:fuel
          - entity: sensor.hymer_adblue_level
            name: AdBlue Level
            icon: mdi:car-turbocharger

      # ── Fuel (computed from 93 L tank) ──
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.hymer_fuel_level
            name: Diesel
            min: 0
            max: 100
            severity:
              green: 40
              yellow: 20
              red: 10
            needle: true
          - type: gauge
            entity: sensor.hymer_fuel_level_liters
            name: Liters
            min: 0
            max: 93
            severity:
              green: 37
              yellow: 19
              red: 9
            needle: true
      - type: entities
        title: "⛽ Fuel (93 L Tank)"
        show_header_toggle: false
        entities:
          - entity: sensor.hymer_fuel_level_liters
            name: Tank Content
            icon: mdi:fuel
          - entity: sensor.hymer_fuel_consumption
            name: Consumption
            icon: mdi:gas-station-outline
          - entity: sensor.hymer_estimated_range
            name: Estimated Range
            icon: mdi:map-marker-distance

      # ── Security ──
      - type: entities
        title: "🔒 Security"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_lock
            name: Lock
            icon: mdi:lock
          - entity: sensor.hymer_ignition
            name: Ignition
            icon: mdi:key
          - entity: binary_sensor.hymer_engine_running_corrected
            name: Engine Running
            icon: mdi:engine

  # ══════════════════════════════════════════════════════════
  # Doors & Vehicle Lights
  # ══════════════════════════════════════════════════════════
  - title: Doors
    path: doors
    icon: mdi:car-door
    cards:
      # ── Doors ──
      # S600: (1,12)=driver, (1,13)=passenger confirmed at vehicle.
      # (1,11) and (1,14) are vehicle warnings per S700 PR #44.
      - type: entities
        title: "🚪 Doors"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_driver_door
            name: Driver
            icon: mdi:car-door
          - entity: binary_sensor.hymer_passenger_door
            name: Passenger
            icon: mdi:car-door
          - entity: binary_sensor.hymer_lock
            name: Lock
            icon: mdi:lock

      # ── Vehicle Warnings ──
      # (1,11) wiping_water_empty, (1,14) motor_oil_warning per S700 PR #44
      # (1,17) coolant_warning — moved here from Chassis State for grouping
      - type: entities
        title: "⚠️ Vehicle Warnings"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_washer_fluid_low
            name: Washer Fluid Low
            icon: mdi:wiper-wash
          - entity: binary_sensor.hymer_motor_oil_warning
            name: Motor Oil Warning
            icon: mdi:oil
          - entity: binary_sensor.hymer_coolant_warning
            name: Coolant Warning
            icon: mdi:coolant-temperature

      # ── Chassis State ──
      # Slots (1,17)-(1,22) are chassis state flags, NOT vehicle lights.
      # Confirmed via PR #44 S700 observations + S600 live data:
      # (1,18) read "ON" while parked = parking brake, not headlamp.
      - type: entities
        title: "🚗 Chassis State"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_parking_brake
            name: Parking Brake
            icon: mdi:car-brake-parking
          - entity: binary_sensor.hymer_auxiliary_heater_available
            name: Aux Heater Available
            icon: mdi:radiator
          - entity: binary_sensor.hymer_auxiliary_heater
            name: Aux Heater
            icon: mdi:radiator
          - entity: binary_sensor.hymer_cruise_control_can
            name: Cruise Control
            icon: mdi:car-cruise-control
          - entity: binary_sensor.hymer_downhill_assist
            name: Downhill Assist
            icon: mdi:arrow-down-bold

  # ══════════════════════════════════════════════════════════
  # Interior Lights
  # ══════════════════════════════════════════════════════════
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    cards:
      # ── Master Groups (native SCU group controls) ──
      - type: markdown
        content: "## 💡 Master Groups"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.hymer_wohnen_all_lights
            name: All Wohnen
            icon: mdi:lightbulb-group
            color: amber
          - type: tile
            entity: light.hymer_privat_all_lights
            name: All Privat
            icon: mdi:lightbulb-group-outline
            color: amber

      # ── Living Area ──
      - type: markdown
        content: "## 🛋️ Living Area"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.hymer_living_ceiling
            name: Ceiling
            icon: mdi:ceiling-light
            color: amber
          - type: tile
            entity: light.hymer_living_ambient
            name: Ambient
            icon: mdi:wall-sconce-flat
            color: amber
          - type: tile
            entity: light.hymer_kitchen
            name: Kitchen
            icon: mdi:countertop
            color: amber
          - type: tile
            entity: light.hymer_seating_overhead
            name: Seating
            icon: mdi:ceiling-light-outline
            color: amber

      # ── Bedroom & Bath ──
      - type: markdown
        content: "## 🛏️ Bedroom & Bath"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.hymer_bedroom_ambient
            name: Bed Ambient
            icon: mdi:lamp
            color: amber
          - type: tile
            entity: light.hymer_night_light
            name: Night Light
            icon: mdi:weather-night
            color: deep-purple
          - type: tile
            entity: light.hymer_bathroom_ceiling
            name: Bathroom
            icon: mdi:shower-head
            color: amber
          - type: tile
            entity: light.hymer_bedroom_overhead
            name: Bed Overhead
            icon: mdi:ceiling-light
            color: amber

      # ── Outside ──
      - type: markdown
        content: "## 🏕️ Outside"
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.hymer
            name: LED Bar
            icon: mdi:led-strip-variant
            color: amber

  # ══════════════════════════════════════════════════════════
  # GPS
  # ══════════════════════════════════════════════════════════
  - title: GPS
    path: gps
    icon: mdi:map-marker
    cards:
      - type: map
        entities:
          - entity: device_tracker.hymer_location
        default_zoom: 15
        hours_to_show: 24
        aspect_ratio: "16:9"

      - type: entities
        title: "📍 Position"
        show_header_toggle: false
        entities:
          - entity: device_tracker.hymer_location
            name: Location
            icon: mdi:map-marker
          - entity: sensor.hymer_gps_coordinates
            name: Coordinates
            icon: mdi:crosshairs-gps

      - type: entities
        title: "📡 Signal"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_scu_connected
            name: SCU Online
            icon: mdi:access-point

  # ══════════════════════════════════════════════════════════
  # System
  # ══════════════════════════════════════════════════════════
  - title: System
    path: system
    icon: mdi:chip
    cards:
      - type: entities
        title: "🔧 System Info"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hymer_scu_connected
            name: SCU Connected
            icon: mdi:access-point
          - entity: sensor.hymer_scu_firmware
            name: SCU Firmware
            icon: mdi:chip
          - entity: sensor.hymer_truma_firmware
            name: Truma Firmware
            icon: mdi:chip
          - entity: update.hymer_connect_update
            name: Integration Update
            icon: mdi:update

      # ── SCU Restart (with confirmation dialog) ──
      - type: tile
        entity: button.hymer_restart_scu
        name: Restart SCU
        icon: mdi:restart-alert
        color: red
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.hymer_restart_scu
          confirmation:
            text: "Are you sure you want to restart the SCU? The vehicle control unit will reboot and reconnect (~30-60s)."
      # ── Diagnostic: EBL402 slots (3,8) and (3,9) ──

