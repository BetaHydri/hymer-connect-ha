# HYMER Connect Dashboard for Home Assistant
# Updated for v2.6.3 — renamed entity IDs + corrected template sensors
#
# Usage:
#   1. Go to Settings > Dashboards > + Add Dashboard
#   2. Open the dashboard > Edit > three dots > Raw configuration editor
#   3. Paste this content and save
#
# Note: The "Master Switches" (All Wohnen / All Privat) require HA light groups.
# Create them via Settings > Helpers > Light group before using this dashboard.
# See dashboards/README.md for setup instructions.

title: HYMER Connect
views:
  - title: Vehicle
    path: vehicle
    icon: mdi:rv-truck
    cards:
      - type: entities
        title: Vehicle Information
        entities:
          - entity: sensor.hymer_model
            name: Model
          - entity: sensor.hymer_model_year
            name: Model Year
          - entity: sensor.hymer_vin
            name: VIN
      - type: entities
        title: Driving
        entities:
          - entity: sensor.hymer_odometer
            name: Odometer
          - entity: sensor.hymer_speed_corrected
            name: Speed
          - entity: sensor.hymer_rpm_corrected
            name: RPM
          - entity: sensor.hymer_current_gear
            name: Current Gear
          - entity: sensor.hymer_coolant_temperature
            name: Coolant Temperature
          - entity: sensor.hymer_engine_hours
            name: Engine Hours
          - entity: sensor.hymer_engine_torque_corrected
            name: Engine Torque
      - type: entities
        title: Fuel & AdBlue
        entities:
          - entity: sensor.hymer_adblue_level
            name: AdBlue Level
          - entity: sensor.hymer_adblue_temperature
            name: AdBlue Temperature
          - entity: sensor.hymer_dpf_status
            name: DPF Status
      - type: entities
        title: Security
        entities:
          - entity: binary_sensor.hymer_lock
            name: Lock Status
          - entity: sensor.hymer_ignition
            name: Ignition
          - entity: binary_sensor.hymer_engine_running_corrected
            name: Engine Running
          - entity: binary_sensor.hymer_handbrake
            name: Handbrake
          - entity: binary_sensor.hymer_cruise_control
            name: Cruise Control
  - title: Power
    path: power
    icon: mdi:battery-charging
    cards:
      - type: gauge
        entity: sensor.hymer_battery_level
        name: Battery SOC
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 25
          red: 10
        needle: true
      - type: gauge
        entity: sensor.hymer_battery_voltage
        name: Battery Voltage
        min: 10
        max: 15
        severity:
          green: 12.4
          yellow: 11.8
          red: 11
        needle: true
      - type: entities
        title: Habitation Battery
        entities:
          - entity: sensor.hymer_battery_voltage
            name: Battery Voltage
          - entity: sensor.hymer_battery_current
            name: Battery Current
          - entity: sensor.hymer_battery_level
            name: State of Charge
          - entity: sensor.hymer_battery_type
            name: Battery Type
          - entity: sensor.hymer_chassis_battery_voltage
            name: Chassis Battery
      - type: entities
        title: Charging / Solar
        entities:
          - entity: sensor.hymer_charge_phase
            name: Charge Phase
          - entity: binary_sensor.hymer_charger
            name: Charger Active
          - entity: binary_sensor.hymer_solar_active
            name: Solar Active
          - entity: sensor.hymer_solar_voltage
            name: Solar Voltage
          - entity: sensor.hymer_solar_current
            name: Solar Current
          - entity: sensor.hymer_solar_power
            name: Solar Power
          - entity: sensor.hymer_power_source
            name: Power Source
          - entity: binary_sensor.hymer_solar_panel
            name: Solar Panel Connected
          - entity: binary_sensor.hymer_main_switch
            name: Main Switch
  - title: Climate
    path: climate
    icon: mdi:thermometer
    cards:
      - type: entities
        title: Temperatures
        entities:
          - entity: sensor.hymer_ambient_temperature
            name: Ambient
      - type: thermostat
        entity: climate.hymer_truma_heater
        name: Truma Heater
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - heat
              - "off"
      - type: entities
        title: Truma Heater Details
        entities:
          - entity: climate.hymer_truma_heater
            name: Heater Control
          - entity: sensor.hymer_heater_fan_speed
            name: Fan Speed
          - entity: sensor.hymer_heater_fuel_type
            name: Fuel Type
          - entity: sensor.hymer_heater_electric_power
            name: Electric Power
          - entity: sensor.hymer_heater_operating_mode
            name: Operating Mode
          - entity: binary_sensor.hymer_truma_connected
            name: Truma Connected
          - entity: sensor.hymer_truma_status
            name: Truma Status
      - type: entities
        title: Boiler (Hot Water)
        entities:
          - entity: select.hymer_boiler_mode
            name: Boiler Mode
      - type: entities
        title: Fridge
        entities:
          - entity: select.hymer_fridge_mode
            name: Fridge Mode
          - entity: sensor.hymer_fridge_mode
            name: Fridge Status (raw)
          - entity: sensor.hymer_fridge_status
            name: Fridge Status
  - title: Water
    path: water
    icon: mdi:water
    cards:
      - type: gauge
        entity: sensor.hymer_fresh_water_level
        name: Fresh Water
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 25
          red: 10
        needle: true
      - type: gauge
        entity: sensor.hymer_grey_water_level
        name: Gray Water
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 60
          red: 80
        needle: true
      - type: entities
        title: Water System
        entities:
          - entity: sensor.hymer_fresh_water_level
            name: Fresh Water Level
          - entity: sensor.hymer_grey_water_level
            name: Grey Water Level
          - entity: binary_sensor.hymer_water_pump
            name: Water Pump
  - title: Doors
    path: doors
    icon: mdi:car-door
    cards:
      - type: entities
        title: Doors
        entities:
          - entity: binary_sensor.hymer_driver_door
            name: Driver Door
          - entity: binary_sensor.hymer_passenger_door
            name: Passenger Door
          - entity: binary_sensor.hymer_sliding_door
            name: Sliding Door
          - entity: binary_sensor.hymer_rear_door
            name: Rear Door
          - entity: binary_sensor.hymer_lock
            name: Lock Status
      - type: entities
        title: Vehicle Lights
        entities:
          - entity: binary_sensor.hymer_headlamp
            name: Headlamp
          - entity: binary_sensor.hymer_high_beam
            name: High Beam
          - entity: binary_sensor.hymer_parking_light
            name: Parking Light
          - entity: binary_sensor.hymer_front_fog_light
            name: Fog Front
          - entity: binary_sensor.hymer_rear_fog_light
            name: Fog Rear
          - entity: binary_sensor.hymer_turn_signal
            name: Turn Signal
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## ⚡ Master Switches"
            card_mod:
              style: >
                ha-card { background: none; box-shadow: none; padding: 0 0 0
                4px; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: light
                entity: light.all_wohnen
                name: All Wohnen
              - type: light
                entity: light.all_privat
                name: All Privat
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## 🛋️ Living Area"
            card_mod:
              style: >
                ha-card { background: none; box-shadow: none; padding: 0 0 0
                4px; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: light
                entity: light.hymer_living_ceiling
                name: Ceiling
              - type: light
                entity: light.hymer_living_ambient
                name: Ambient
              - type: light
                entity: light.hymer_kitchen
                name: Kitchen
              - type: light
                entity: light.hymer_seating_overhead
                name: Seating
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## 🛏️ Bedroom & Bath"
            card_mod:
              style: >
                ha-card { background: none; box-shadow: none; padding: 0 0 0
                4px; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: light
                entity: light.hymer_bedroom_ambient
                name: Bed Ambient
              - type: light
                entity: light.hymer_night_light
                name: Night Light
              - type: light
                entity: light.hymer_bathroom_ceiling
                name: Bathroom
              - type: light
                entity: light.hymer_bedroom_overhead
                name: Bed Overhead
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## 🏕️ Outside"
            card_mod:
              style: >
                ha-card { background: none; box-shadow: none; padding: 0 0 0
                4px; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: light
                entity: light.hymer_outside_light
                name: Outside Light
  - title: Controls
    path: controls
    icon: mdi:toggle-switch
    cards:
      - type: entities
        title: Switches
        entities:
          - entity: switch.hymer_12v_main_switch
            name: 12V Main Switch
          - entity: switch.hymer_water_pump
            name: Water Pump
  - title: GPS
    path: gps
    icon: mdi:map-marker
    cards:
      - type: map
        entities:
          - entity: device_tracker.hymer_location
        default_zoom: 15
        hours_to_show: 24
      - type: entities
        title: GPS Details
        entities:
          - entity: device_tracker.hymer_location
            name: Location
          - entity: sensor.hymer_gps_coordinates
            name: Coordinates
          - entity: sensor.hymer_altitude
            name: Altitude
          - entity: sensor.hymer_gps_heading
            name: Heading
          - entity: sensor.hymer_gps_satellites
            name: Satellites
          - entity: sensor.hymer_gps_signal
            name: Signal Quality
          - entity: binary_sensor.hymer_gps_fix
            name: GPS Fix
  - title: System
    path: system
    icon: mdi:chip
    cards:
      - type: entities
        title: Connectivity
        entities:
          - entity: binary_sensor.hymer_scu_connected
            name: SCU Connected
          - entity: sensor.hymer_scu_firmware
            name: SCU Firmware
          - entity: sensor.hymer_truma_firmware
            name: Truma Firmware
      - type: entities
        title: Tires
        entities:
          - entity: sensor.hymer_tyre_pressure
            name: Tire Pressure
