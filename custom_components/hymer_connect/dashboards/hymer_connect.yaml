# HYMER Connect Dashboard for Home Assistant
# Copy this to your dashboards configuration or import via UI
#
# File: hymer_connect_dashboard.yaml

title: HYMER Connect
views:
  - title: Vehicle Overview
    path: hymer-overview
    icon: mdi:rv-truck
    type: sections
    sections:
      # Power & Battery
      - type: grid
        title: Power & Battery
        cards:
          - type: gauge
            entity: sensor.hymer_connect_battery_level
            name: Living Battery
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 20
              red: 10
            needle: true

          - type: entity
            entity: sensor.hymer_connect_battery_voltage
            name: Battery Voltage
            icon: mdi:flash

          - type: entity
            entity: sensor.hymer_connect_chassis_battery_voltage
            name: Chassis Battery
            icon: mdi:car-battery

          - type: entity
            entity: binary_sensor.hymer_connect_mains_power
            name: Mains Power
            icon: mdi:power-plug

      # Water Tanks
      - type: grid
        title: Water Tanks
        cards:
          - type: gauge
            entity: sensor.hymer_connect_fresh_water_level
            name: Fresh Water
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 10
            needle: true

          - type: gauge
            entity: sensor.hymer_connect_grey_water_level
            name: Grey Water
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 80
            needle: true

      # Temperature
      - type: grid
        title: Climate
        cards:
          - type: entity
            entity: sensor.hymer_connect_indoor_temperature
            name: Indoor
            icon: mdi:home-thermometer

          - type: entity
            entity: sensor.hymer_connect_outdoor_temperature
            name: Outdoor
            icon: mdi:thermometer

          - type: entity
            entity: binary_sensor.hymer_connect_heater_running
            name: Heater
            icon: mdi:radiator

          - type: entity
            entity: binary_sensor.hymer_connect_fridge_running
            name: Fridge
            icon: mdi:fridge

      # Security & Status
      - type: grid
        title: Security & Status
        cards:
          - type: entity
            entity: binary_sensor.hymer_connect_siu_online
            name: Vehicle Online
            icon: mdi:access-point

          - type: entity
            entity: binary_sensor.hymer_connect_door_open
            name: Door
            icon: mdi:door

          - type: entity
            entity: binary_sensor.hymer_connect_window_open
            name: Window
            icon: mdi:window-open

          - type: entity
            entity: binary_sensor.hymer_connect_alarm_active
            name: Alarm
            icon: mdi:alarm-light

      # Tire Pressure
      - type: grid
        title: Tire Pressure
        cards:
          - type: entity
            entity: sensor.hymer_connect_tire_pressure_front_left
            name: Front Left
            icon: mdi:tire

          - type: entity
            entity: sensor.hymer_connect_tire_pressure_front_right
            name: Front Right
            icon: mdi:tire

          - type: entity
            entity: sensor.hymer_connect_tire_pressure_back_left
            name: Back Left
            icon: mdi:tire

          - type: entity
            entity: sensor.hymer_connect_tire_pressure_back_right
            name: Back Right
            icon: mdi:tire
