<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Motorhome silhouette (simplified) -->
  <g transform="translate(256,370)" fill="white" opacity="0.15">
    <!-- Road line -->
    <rect x="-180" y="-10" width="360" height="4" rx="2"/>
  </g>
  <!-- HC text -->
  <text x="256" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="220" fill="white" letter-spacing="-8">HC</text>
  <!-- Small "connect" subtitle -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="48" fill="white" opacity="0.85" letter-spacing="12">CONNECT</text>
</svg>
